name: Build, publish and deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-testing:
    name: Deploy testing
    needs: build-and-push-image
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, testing]
    environment:
      name: Testing
    permissions:
      packages: read

    env:
      CONTAINER_NAME: com_profcomff_caz_parser_test
      IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
      DB_DSN: ${{ secrets.DB_DSN }}
      WRITER_TOKEN: ${{ secrets.WRITER_TOKEN }}
      MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
      CHAT_ID_ERRORS: ${{ secrets.CHAT_ID_ERRORS }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
      SENDING_HOUR: ${{ secrets.SENDING_HOUR }}
      SENDING_MINUTES: ${{ secrets.SENDING_MINUTES }}
      PROXY_URL: ${{ secrets.PROXY_URL }}

    steps:
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Migrate database
        run: |
          docker run --rm \
            --network=web \
            --env DB_DSN \
            --name "${CONTAINER_NAME}_migration" \
            "$IMAGE" \
            alembic upgrade head

      - name: Run testing container
        run: |
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true

          docker run --detach \
            --restart on-failure:3 \
            --network=web \
            --env DB_DSN \
            --env WRITER_TOKEN \
            --env MY_CHAT_ID \
            --env CHAT_ID_ERRORS \
            --env TG_API_ID \
            --env TG_API_HASH \
            --env PHONE_NUMBER \
            --env VK_TOKEN \
            --env SENDING_HOUR \
            --env SENDING_MINUTES \
            --env PROXY_URL \
            --name "$CONTAINER_NAME" \
            "$IMAGE"

  deploy-production:
    name: Deploy production
    needs: build-and-push-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, production]
    environment:
      name: Production
    permissions:
      packages: read

    env:
      CONTAINER_NAME: com_profcomff_caz_parser
      IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      DB_DSN: ${{ secrets.DB_DSN }}
      WRITER_TOKEN: ${{ secrets.WRITER_TOKEN }}
      MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
      CHAT_ID_ERRORS: ${{ secrets.CHAT_ID_ERRORS }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
      SENDING_HOUR: ${{ secrets.SENDING_HOUR }}
      SENDING_MINUTES: ${{ secrets.SENDING_MINUTES }}
      PROXY_URL: ${{ secrets.PROXY_URL }}

    steps:
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Migrate database
        run: |
          docker run --rm \
            --network=web \
            --env DB_DSN \
            --name "${CONTAINER_NAME}_migration" \
            "$IMAGE" \
            alembic upgrade head

      - name: Run production container
        run: |
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true

          docker run --detach \
            --restart always \
            --network=web \
            --env DB_DSN \
            --env WRITER_TOKEN \
            --env MY_CHAT_ID \
            --env CHAT_ID_ERRORS \
            --env TG_API_ID \
            --env TG_API_HASH \
            --env PHONE_NUMBER \
            --env VK_TOKEN \
            --env SENDING_HOUR \
            --env SENDING_MINUTES \
            --env PROXY_URL \
            --name "$CONTAINER_NAME" \
            "$IMAGE"